name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/Speakflow.sln
      - name: Build
        run: dotnet build backend/Speakflow.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test backend/Speakflow.sln --configuration Release --no-build
